[package]
name = "mbrowser"
version = "0.1.0"
edition = "2024"
description = "Meteor Browser: fast, lightweight Rust browser shell over the system WebView2 (Chromium) engine"

[dependencies]
# Brave's ad-blocking engine (uBlock Origin / AdBlock Plus syntax). Without
# "single-thread" the engine is Send, so it is compiled in a background thread.
adblock = { version = "0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "css-validation"] }
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
