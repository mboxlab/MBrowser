# Push a tag like v0.1.0 (it must match `version` in Cargo.toml) to build the browser,
# pack it with Inno Setup, smoke-test install/uninstall and publish a GitHub release
# with MBrowser-Setup.exe and the bare mbrowser.exe.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check tag matches Cargo.toml
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match Cargo.toml version $version (expected v$version)"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      - name: Build installer
        run: |
          $find = { Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          $iscc = & $find
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = & $find
          }
          if (-not $iscc) { throw "Inno Setup not found" }
          & $iscc.FullName "/DAppVersion=$env:VERSION" installer\mbrowser.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Copy-Item target\release\mbrowser.exe dist\mbrowser.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test install / uninstall
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\MBrowser"
          $exe = "$dir\mbrowser.exe"
          $setup = (Resolve-Path dist\MBrowser-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', '/LOG=setup.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log; throw "setup exit code $($p.ExitCode)" }

          if (-not (Test-Path $exe)) { throw "exe not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\MBrowser.lnk")) { throw "no Start Menu shortcut" }
          $cmd = (Get-Item 'HKCU:\Software\Classes\MBrowserURL\shell\open\command').GetValue('')
          if ($cmd -ne "`"$exe`" `"%1`"") { throw "unexpected URL handler: $cmd" }
          $caps = (Get-Item 'HKCU:\Software\RegisteredApplications').GetValue('MBrowser')
          if ($caps -ne 'Software\Clients\StartMenuInternet\MBrowser\Capabilities') { throw "unexpected RegisteredApplications: $caps" }
          "install OK"

          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller re-launches itself from %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "exe not removed" }
          foreach ($key in 'HKCU:\Software\Classes\MBrowserURL', 'HKCU:\Software\Clients\StartMenuInternet\MBrowser') {
            if (Test-Path $key) { throw "registry key left behind: $key" }
          }
          if ((Get-Item 'HKCU:\Software\RegisteredApplications').GetValue('MBrowser')) { throw "RegisteredApplications value left behind" }
          "uninstall OK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG dist\MBrowser-Setup.exe dist\mbrowser.exe --clobber
          } else {
            gh release create $env:TAG dist\MBrowser-Setup.exe dist\mbrowser.exe --title "Meteor Browser $env:VERSION" --notes-file installer\release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh failed ($LASTEXITCODE)" }
